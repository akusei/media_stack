---
- name: Ensure installation directory exists.
  ansible.builtin.file:
    path: "{{ seerr_install_path }}"
    state: directory
    owner: root
    group: root
    mode: "0550"
    recurse: false

- name: Ensure configuration directory exists.
  ansible.builtin.file:
    path: "{{ seerr_config_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
    recurse: false
